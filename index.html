<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Local Music Player PWA</title>
  <meta name="description" content="Premium offline local music player with visualizer, smart lyrics, and adaptive UI.">
  <link rel="manifest" href="./manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.7/dist/jsmediatags.min.js" defer></script>
</head>
<body>
  <div class="app">
    <!-- Top Header with Hamburger -->
    <header class="app-header">
      <button class="sidebar-toggle" id="sidebarToggle"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="logo"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M9 17a3 3 0 11-3-3h1V5.5L19 3v11a3 3 0 11-3-3h1V6.85L9 8.35V17z"/></svg> Local Music</div>
    </header>

    <div class="content-wrapper">
      <!-- Collapsible Navigation Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <span class="logo-text"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M9 17a3 3 0 11-3-3h1V5.5L19 3v11a3 3 0 11-3-3h1V6.85L9 8.35V17z"/></svg> Navigasi</span>
          <button class="close-sidebar" id="closeSidebar"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>
        <nav class="sidebar-nav">
          <button data-view="library" class="nav-item active">
            <span class="nav-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg></span>
            <span class="nav-text">Library</span>
          </button>
          <button data-view="foryou" class="nav-item">
            <span class="nav-icon"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1l2.5 8.5L23 12l-8.5 2.5L12 23l-2.5-8.5L1 12l8.5-2.5z"/></svg></span>
            <span class="nav-text">For You</span>
          </button>
          <button data-view="playlists" class="nav-item">
            <span class="nav-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M3 6h12M3 12h12M3 18h7"/><path d="M17 14l5 3-5 3z" fill="currentColor" stroke="none"/></svg></span>
            <span class="nav-text">Playlists</span>
          </button>
          <button data-view="search" class="nav-item">
            <span class="nav-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M21 21l-4.35-4.35"/></svg></span>
            <span class="nav-text">Search</span>
          </button>
        </nav>
      </aside>

      <!-- Mobile Sidebar Overlay -->
      <div class="sidebar-overlay" id="sidebarOverlay"></div>

      <!-- Main Content Views -->
      <main class="main-content">
        <!-- Library View with Sub-Tabs -->
        <section id="library" class="view active">
          <h2 class="view-title">Library Lagu</h2>
          <button class="import-btn" id="syncR2">
            <span>☁</span> Sync R2 Library
          </button>

          <!-- Library Sub-Tabs -->
          <div class="lib-tabs" id="libTabs">
            <button class="lib-tab active" data-tab="allSongs">All Songs</button>
            <button class="lib-tab" data-tab="albums">Albums</button>
            <button class="lib-tab" data-tab="artists">Artists</button>
            <button class="lib-tab" data-tab="recentlyAdded">Recently Added</button>
            <button class="lib-tab" data-tab="favorites">Favorites</button>
          </div>

          <!-- Tab Content Panes -->
          <div id="allSongs" class="lib-tab-content active">
            <div id="libraryList"></div>
          </div>
          <div id="albums" class="lib-tab-content">
            <div class="card-grid" id="albumsGrid"></div>
          </div>
          <div id="artists" class="lib-tab-content">
            <div class="card-grid" id="artistsGrid"></div>
          </div>
          <div id="recentlyAdded" class="lib-tab-content">
            <div id="recentList"></div>
          </div>
          <div id="favorites" class="lib-tab-content">
            <div id="favoritesList"></div>
          </div>
        </section>

        <!-- For You View -->
        <section id="foryou" class="view">
          <h2 class="view-title"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1l2.5 8.5L23 12l-8.5 2.5L12 23l-2.5-8.5L1 12l8.5-2.5z"/></svg> For You</h2>
          <div id="foryouContent"></div>
        </section>

        <!-- Playlists View -->
        <section id="playlists" class="view">
          <h2 class="view-title">Playlist Saya</h2>
          <button class="import-btn" id="newPlaylist">
            <span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span> Playlist Baru
          </button>
          <div class="playlist-grid" id="playlistList"></div>
        </section>

        <!-- Search View -->
        <section id="search" class="view">
          <h2 class="view-title">Cari Musik</h2>
          <input type="text" class="search-box" placeholder="Cari lagu, artis, atau album..." id="searchInput">
          <div id="searchResults"></div>
        </section>
      </main>
    </div>

    <!-- Docked Mini Player -->
    <div class="mini-player" id="miniPlayer">
      <div class="progress-mini" id="miniProgress"></div>
      <img id="miniCover" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Cover Art" loading="lazy">
      <div style="flex: 1; overflow: hidden;">
        <div id="miniTitle">Memuat musik...</div>
        <div id="miniArtist" style="font-size: 0.85rem; color: #aaa;"></div>
      </div>
      <button class="icon-btn" id="miniPlay" style="font-size: 1.6rem; margin-right: 8px;"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg></button>
      <button class="icon-btn" id="miniNext" style="font-size: 1.4rem;"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M5 4l10 8-10 8V4zm12 0h2v16h-2V4z"/></svg></button>
    </div>
  </div>

  <!-- Now Playing Screen -->
  <div class="now-playing" id="nowPlaying">
    <div class="blur-bg" id="blurBg"></div>
    <div class="now-content">
      <!-- Back Button Area -->
      <div class="now-header">
        <button class="back-btn" id="closeNow">
          <span class="back-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></span>
          <span class="back-text">Kembali</span>
        </button>
      </div>

      <!-- Visualizer -->
      <div class="visualizer-wrap">
        <canvas id="visualizerCanvas"></canvas>
      </div>

      <!-- Large Album Art Container -->
      <div class="cover-large-container">
        <img class="cover-large" id="coverLarge" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Album Cover" loading="lazy">
      </div>

      <!-- Title & Artist Metadata -->
      <div class="np-meta">
        <h2 id="npTitle">Memuat Musik...</h2>
        <p id="npArtist"></p>
      </div>

      <!-- Custom Seekbar & Timestamps -->
      <div class="seek-container">
        <input type="range" min="0" max="100" value="0" class="seek" id="seekBar">
        <div class="time-row">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>

      <!-- Transport Controls -->
      <div class="controls">
        <button id="shuffleBtn" title="Shuffle"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
        <button id="prevBtn" title="Sebelumnya"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M19 20L9 12l10-8v16zM5 4h2v16H5V4z"/></svg></button>
        <button class="big-play" id="playBtn" title="Putar/Jeda"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg></button>
        <button id="nextBtn" title="Berikutnya"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M5 4l10 8-10 8V4zm12 0h2v16h-2V4z"/></svg></button>
        <button id="repeatBtn" title="Ulangi"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg></button>
      </div>

      <!-- Volume Slider -->
      <div class="volume-row">
        <span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.54 8.46a5 5 0 010 7.07"/></svg></span>
        <input type="range" min="0" max="100" value="100" class="volume-slider" id="volumeSlider">
        <span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg></span>
      </div>

      <!-- Synchronized / Static Lyrics -->
      <div class="lyrics" id="lyrics"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js" defer></script>
</body>
</html>
